spring:
  application:
    name: smartresolve
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/smartresolve}
    username: ${SPRING_DATASOURCE_USERNAME:smartresolve}
    password: ${SPRING_DATASOURCE_PASSWORD:smartresolve}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/migration-postgresql
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${SMARTRESOLVE_AI_MODEL:llama3.2}
      embedding:
        options:
          model: ${SMARTRESOLVE_EMBEDDING_MODEL:nomic-embed-text}
    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 768
        distance-type: COSINE_DISTANCE

smartresolve:
  knowledge:
    similarity-threshold: ${SMARTRESOLVE_KNOWLEDGE_SIMILARITY_THRESHOLD:0.75}

server:
  port: 8080

logging:
  level:
    com.smartresolve: INFO
